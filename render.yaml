# Blueprint de Render para POSTEA. / tu ARTículo (plan gratuito).
# Crea el servicio web y la base PostgreSQL en la misma región (Virginia, la más cercana a Bogotá).
# Render → New → Blueprint → elige este repositorio. Te pedirá los valores marcados con `sync: false`.

services:
  - type: web
    name: postea-imago
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Sin dockerCommand: usa el CMD del Dockerfile (migraciones idempotentes y luego el servidor en $PORT).
    # Al arrancar se crea el admin inicial si aún no existe. Node 24 LTS viene fijado en el Dockerfile.
    # Liveness: 200 mientras el proceso atienda, aunque la base esté en mantenimiento (evita reinicios en bucle).
    # La base se verifica en /health/db (para el monitor externo) y antes de escuchar (el CMD migra primero).
    healthCheckPath: /health
    # Cada push a la rama redespliega. Recomendado: pasarlo a false desde el inicio de Producción (20 oct)
    # hasta terminar la exhibición, y desplegar a mano (Manual Deploy) solo correcciones probadas.
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: America/Bogota
      - key: DATABASE_URL
        fromDatabase:
          name: postea-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # URL pública sin "/" final, p. ej. https://postea-imago.onrender.com. Define a dónde apuntan los QR.
      - key: BASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # Mínimo 12 caracteres. Solo se usa para crear el admin la primera vez.
      - key: ADMIN_PASSWORD
        sync: false
      # Opcional, separado por comas (p. ej. ucompensar.edu.co). Vacío = cualquier dominio.
      - key: ALLOWED_EMAIL_DOMAINS
        sync: false
      - key: VISITOR_DOMAIN_RESTRICTED
        value: "false"
      # Render pasa por Cloudflare: esta cabecera trae la IP real del visitante para los límites y las visitas.
      # Verifícalo en Admin → Tablero → "Diagnóstico del proxy" después del primer despliegue.
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      # Fecha de vencimiento de la base Free (AAAA-MM-DD), la que muestra Render → postea-db. El tablero avisa.
      - key: DB_EXPIRA_EN
        sync: false

databases:
  - name: postea-db
    plan: free
    region: virginia
    databaseName: postea
    user: postea
    postgresMajorVersion: "16"
    # Sin acceso externo por defecto; la app usa la conexión interna. Para pg_dump desde tu equipo,
    # agrega tu IP en Render → postea-db → Networking.
    ipAllowList: []
