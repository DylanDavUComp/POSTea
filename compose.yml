# Desarrollo local. Render NO usa este archivo: construye el Dockerfile y entrega DATABASE_URL.
#   docker compose up -d --wait            → solo PostgreSQL (lo usual: la app corre con `npm run dev`)
#   docker compose --profile app up --build → PostgreSQL + la app en contenedor, como en Render
# Puerto host 15432 para no chocar con otros proyectos que usan 5432.
services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: postea
      POSTGRES_USER: postea
      POSTGRES_PASSWORD: postea
    ports:
      # Solo este equipo: sin 127.0.0.1 el puerto queda abierto a la red (p. ej. la wifi del campus) con la contraseña "postea".
      - "127.0.0.1:15432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postea -d postea"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    profiles: ["app"]
    build: .
    # SESSION_SECRET, ADMIN_*, BASE_URL… salen de .env; la conexión se redirige al servicio db.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://postea:postea@db:5432/postea
      DB_SSL: "false"
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
